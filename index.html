<style>
:root{--ink:#24402a;--ink2:#56705a;--leaf:#5fae4a;--leaf-d:#2f6b2a;--edge:rgba(255,255,255,.75)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Jost,system-ui,sans-serif;color:var(--ink);background:#f4fbef}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
 background:radial-gradient(120% 80% at 10% 0%,#ffffff 0%,transparent 55%),radial-gradient(90% 70% at 100% 100%,#b9ecd6 0%,transparent 60%),linear-gradient(160deg,#f4fbef,#d8f3c2 60%,#c6efd9)}
.card{width:100%;max-width:360px;padding:28px 22px 22px;border-radius:28px;text-align:center;
 background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.38));border:1px solid var(--edge);
 box-shadow:0 18px 50px rgba(70,140,70,.18),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.lotus{width:92px;height:78px;filter:drop-shadow(0 8px 16px rgba(127,201,106,.45));animation:b 6s ease-in-out infinite}
@keyframes b{50%{transform:scale(1.05)}}
h1{margin:10px 0 4px;font-weight:500;font-size:26px;letter-spacing:.2px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--leaf),#7fc96a,#8fd8c4);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 18px;color:var(--ink2);font-size:14.5px;line-height:1.45}
input{width:100%;height:50px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.85);padding:0 16px;font:inherit;font-size:17px;color:var(--ink);outline:none;text-align:center}
input:focus{border-color:#9fdc7a;box-shadow:0 0 0 4px rgba(159,220,122,.25)}
button{margin-top:12px;width:100%;height:50px;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:500;color:#173d1a;cursor:pointer;
 background:linear-gradient(135deg,#c9f29a,#9fe6c8);box-shadow:0 8px 22px rgba(95,174,74,.28)}
button:disabled{opacity:.6}
.err{min-height:20px;margin-top:10px;font-size:13.5px;color:#b0574a}
.hint{margin-top:16px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.5);font-size:13px;color:var(--ink2);line-height:1.45;text-align:left}
.ver{margin-top:14px;font-size:11px;color:#8aa08d}
.wait .lotus{animation:b 1.2s ease-in-out infinite}
</style>
</head>

  <h1>Любимое <em>тело</em></h1>
  <div id="gate" hidden>
    <p>Привет 🌿 Введи пароль — один раз на этом телефоне.</p>

      var html=new TextDecoder().decode(buf);
      document.open();document.write(html);document.close();
    });
  }
  function unlock(pw){
    return sub.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey'])
      .then(function(base){return sub.deriveKey({name:'PBKDF2',salt:u8(LOCK.salt),iterations:LOCK.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
      .then(function(pk){return sub.decrypt({name:'AES-GCM',iv:u8(LOCK.iv)},pk,u8(LOCK.ct))})
      .then(function(raw){return sub.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt'])});
  }
  function showGate(){
    document.getElementById('gate').hidden=false;
    var ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(ios&&!standalone) document.getElementById('ios').hidden=false;
    document.getElementById('f').onsubmit=function(e){
      e.preventDefault();var pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
      if(!pw) return; btn.disabled=true;btn.textContent='Открываю…';err.textContent='';document.getElementById('card').classList.add('wait');
      unlock(pw).then(function(k){return putKey(k).then(function(){return open(k)})}).catch(function(){
        btn.disabled=false;btn.textContent='Открыть';document.getElementById('card').classList.remove('wait');
        err.textContent='Не тот пароль. Попробуй ещё раз — без спешки 🌿';
      });
    };
  }
  if(!window.crypto||!sub){document.getElementById('gate').hidden=false;document.getElementById('err').textContent='Этот браузер не умеет расшифровывать. Открой в Safari или Chrome.';return}
  getKey().then(function(k){ if(k) return open(k).catch(showGate); showGate(); });
})();
</script>
</body>
